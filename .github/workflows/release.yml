name: Release

on:
  workflow_dispatch:
    inputs:
      strategy:
        description: Auto releases an unpublished current version, otherwise suggests the next patch
        required: true
        default: auto
        type: choice
        options:
          - auto
          - current
          - patch
          - minor
          - major
          - prerelease
          - promote
          - exact
      exact_version:
        description: SemVer without v; used only when strategy is exact
        required: false
        type: string
      prerelease_id:
        description: Prerelease channel used by auto/prerelease when needed
        required: true
        default: rc
        type: choice
        options:
          - rc
          - beta
          - alpha
      plan_only:
        description: Calculate and display the release without changing Git or registries
        required: true
        default: false
        type: boolean

concurrency:
  group: release-${{ github.repository_id }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  plan:
    name: Plan and authorize
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      packages: read
    outputs:
      current: ${{ steps.version.outputs.current }}
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.version.outputs.tag }}
      prerelease: ${{ steps.version.outputs.prerelease }}
      npm_tag: ${{ steps.version.outputs.npm_tag }}
      needs_bump: ${{ steps.version.outputs.needs_bump }}
      already_released: ${{ steps.version.outputs.already_released }}
      base_sha: ${{ steps.version.outputs.base_sha }}
      source_sha: ${{ steps.version.outputs.source_sha }}
      current_tag_sha: ${{ steps.state.outputs.current_tag_sha }}
    steps:
      - name: Require a main-branch administrator or maintainer
        env:
          GH_TOKEN: ${{ github.token }}
          DISPATCH_ACTOR: ${{ github.actor }}
          TRIGGERING_ACTOR: ${{ github.triggering_actor }}
        run: |
          if [[ "${{ github.run_attempt }}" != '1' ]]; then
            echo 'Do not re-run a release workflow attempt: dispatch a new Auto or Current run to reconcile durable state.' >&2
            exit 1
          fi
          if [[ "${GITHUB_REF}" != 'refs/heads/main' ]]; then
            echo 'Releases must be dispatched from the main branch.' >&2
            exit 1
          fi

          for actor in "${DISPATCH_ACTOR}" "${TRIGGERING_ACTOR}"; do
            permission="$(
              gh api \
                -H 'Accept: application/vnd.github+json' \
                "repos/${GITHUB_REPOSITORY}/collaborators/${actor}/permission" \
                --jq '.role_name // .permission'
            )"
            case "${permission}" in
              admin|maintain) ;;
              *)
                echo "${actor} has ${permission} permission; release requires maintain or admin." >&2
                exit 1
                ;;
            esac
          done
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          fetch-tags: true
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: '22.17.1'
          cache: npm
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4
      - id: state
        name: Inspect immutable release state
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          current="$(node -p "JSON.parse(require('node:fs').readFileSync('package.json', 'utf8')).version")"
          current_tag="v${current}"
          current_tag_sha="$(git rev-list -n 1 "${current_tag}" 2>/dev/null || true)"
          if [[ "${current}" == *-* ]]; then
            npm_channel='next'
          else
            npm_channel='latest'
          fi
          npm_integrity="$(
            npm view "@joomengine/joomla-mcp@${current}" dist.integrity \
              --registry=https://registry.npmjs.org 2>/dev/null || true
          )"
          npm_channel_version="$(
            npm view "@joomengine/joomla-mcp@${npm_channel}" version \
              --registry=https://registry.npmjs.org 2>/dev/null || true
          )"
          npm_latest_version="$(
            npm view '@joomengine/joomla-mcp@latest' version \
              --registry=https://registry.npmjs.org 2>/dev/null || true
          )"
          npm_next_version="$(
            npm view '@joomengine/joomla-mcp@next' version \
              --registry=https://registry.npmjs.org 2>/dev/null || true
          )"
          image="ghcr.io/${GITHUB_REPOSITORY}:${current_tag}"
          if image_report="$(docker buildx imagetools inspect "${image}" 2>/dev/null)"; then
            oci_digest="$(awk '/^Digest:/ { print $2; exit }' <<< "${image_report}")"
            test -n "${oci_digest}"
          else
            oci_digest=''
          fi
          release_json="$(
            gh release view "${current_tag}" \
              --repo "${GITHUB_REPOSITORY}" \
              --json isDraft,isPrerelease 2>/dev/null || true
          )"
          if [[ -n "${release_json}" ]]; then
            release_draft="$(jq -r .isDraft <<< "${release_json}")"
            release_prerelease="$(jq -r .isPrerelease <<< "${release_json}")"
            if [[ "${current}" == *-* ]]; then
              expected_prerelease='true'
            else
              expected_prerelease='false'
            fi
            if [[ "${release_prerelease}" != "${expected_prerelease}" ]]; then
              echo "GitHub release ${current_tag} has prerelease=${release_prerelease}, expected ${expected_prerelease}." >&2
              exit 1
            fi
          else
            release_draft=''
          fi
          if [[ "${release_draft}" == 'true' ]]; then
            github_status='draft'
          elif [[ "${release_draft}" == 'false' ]]; then
            github_status='public'
          else
            github_status='none'
          fi
          assets_valid='false'
          expected_npm_integrity=''
          expected_oci_digest=''
          if [[ "${release_draft}" == 'false' ]]; then
            rm -rf /tmp/current-release-assets
            mkdir -p /tmp/current-release-assets
            gh release download "${current_tag}" \
              --repo "${GITHUB_REPOSITORY}" \
              --dir /tmp/current-release-assets
            (
              cd /tmp/current-release-assets
              sha256sum -c SHA256SUMS
            )
            expected="$(
              printf '%s\n' \
                "SHA256SUMS" \
                "joomengine-mcp-for-joomla-${current_tag}.spdx.json" \
                "joomengine-mcp-for-joomla-${current_tag}.tgz" \
                "joomengine-mcp-for-joomla-deployment-${current_tag}.tar.gz" \
                "pkg_joomlamcp-${current}.zip" \
                "release-manifest.json" \
                | sort
            )"
            actual="$(
              find /tmp/current-release-assets -maxdepth 1 -type f -printf '%f\n' | sort
            )"
            test "${actual}" = "${expected}"
            test "$(jq -r .version /tmp/current-release-assets/release-manifest.json)" = "${current}"
            test "$(jq -r .tag /tmp/current-release-assets/release-manifest.json)" = "${current_tag}"
            test "$(jq -r .commit /tmp/current-release-assets/release-manifest.json)" = "${current_tag_sha}"
            test "$(jq -r .prerelease /tmp/current-release-assets/release-manifest.json)" \
              = "${expected_prerelease}"
            test "$(jq -r .npm.package /tmp/current-release-assets/release-manifest.json)" \
              = '@joomengine/joomla-mcp'
            test "$(jq -r .oci.image /tmp/current-release-assets/release-manifest.json)" = "${image}"
            expected_npm_integrity="$(
              jq -r .npm.integrity /tmp/current-release-assets/release-manifest.json
            )"
            expected_oci_digest="$(
              jq -r .oci.digest /tmp/current-release-assets/release-manifest.json
            )"
            release_tarball="/tmp/current-release-assets/joomengine-mcp-for-joomla-${current_tag}.tgz"
            local_integrity="sha512-$(
              openssl dgst -sha512 -binary "${release_tarball}" | base64 -w0
            )"
            test "${expected_npm_integrity}" = "${local_integrity}"
            assets_valid='true'
          fi

          RELEASE_CURRENT_VERSION="${current}" \
            RELEASE_TAG_SHA="${current_tag_sha}" \
            RELEASE_GITHUB_STATUS="${github_status}" \
            RELEASE_GITHUB_PRERELEASE="${release_prerelease:-false}" \
            RELEASE_ASSETS_VALID="${assets_valid}" \
            RELEASE_NPM_INTEGRITY="${npm_integrity}" \
            RELEASE_EXPECTED_NPM_INTEGRITY="${expected_npm_integrity}" \
            RELEASE_NPM_CHANNEL_VERSION="${npm_channel_version}" \
            RELEASE_OCI_DIGEST="${oci_digest}" \
            RELEASE_EXPECTED_OCI_DIGEST="${expected_oci_digest}" \
            node scripts/release/release-state.mjs

          {
            echo "current=${current}"
            echo "current_tag_sha=${current_tag_sha}"
            echo 'versions<<VERSIONS'
            git tag --list 'v*' | sed 's/^v//'
            printf '%s\n' "${npm_latest_version}" "${npm_next_version}" | sed '/^$/d'
            echo 'VERSIONS'
          } >> "${GITHUB_OUTPUT}"
      - id: version
        name: Calculate suggested version
        env:
          RELEASE_CURRENT_VERSION: ${{ steps.state.outputs.current }}
          RELEASE_STRATEGY: ${{ inputs.strategy }}
          RELEASE_EXACT_VERSION: ${{ inputs.exact_version }}
          RELEASE_PRERELEASE_ID: ${{ inputs.prerelease_id }}
          RELEASE_CURRENT_STATE: ${{ steps.state.outputs.current_state }}
          RELEASE_EXISTING_VERSIONS: ${{ steps.state.outputs.versions }}
          RELEASE_BASE_SHA: ${{ github.sha }}
          RELEASE_CURRENT_TAG_SHA: ${{ steps.state.outputs.current_tag_sha }}
        run: node scripts/release/plan-version.mjs
      - name: Preflight target registry coordinates
        if: steps.version.outputs.already_released != 'true'
        env:
          CURRENT_VERSION: ${{ steps.state.outputs.current }}
          CURRENT_STATE: ${{ steps.state.outputs.current_state }}
          RELEASE_VERSION: ${{ steps.version.outputs.version }}
          RELEASE_TAG: ${{ steps.version.outputs.tag }}
        run: |
          npm_integrity="$(
            npm view "@joomengine/joomla-mcp@${RELEASE_VERSION}" dist.integrity \
              --registry=https://registry.npmjs.org 2>/dev/null || true
          )"
          image="ghcr.io/${GITHUB_REPOSITORY}:${RELEASE_TAG}"
          if image_report="$(docker buildx imagetools inspect "${image}" 2>/dev/null)"; then
            image_digest="$(awk '/^Digest:/ { print $2; exit }' <<< "${image_report}")"
            test -n "${image_digest}"
          else
            image_digest=''
          fi
          if [[ "${RELEASE_VERSION}" != "${CURRENT_VERSION}" ]]; then
            if [[ -n "${npm_integrity}" || -n "${image_digest}" ]]; then
              echo "Target ${RELEASE_VERSION} already exists in npm or GHCR without a matching source tag." >&2
              exit 1
            fi
          fi

  version:
    name: Prepare version commit and tag
    needs: plan
    if: inputs.plan_only != true && needs.plan.outputs.already_released != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: release
    permissions:
      actions: write
      contents: write
    outputs:
      release_commit: ${{ steps.publish.outputs.release_commit }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ needs.plan.outputs.source_sha }}
          fetch-depth: 0
          fetch-tags: true
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: '22.17.1'
          cache: npm
      - name: Generate authoritative release notes
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.plan.outputs.tag }}
          CURRENT_TAG_SHA: ${{ needs.plan.outputs.current_tag_sha }}
        run: |
          mkdir -p .release
          if [[ "${RELEASE_TAG}" == "v${{ needs.plan.outputs.current }}" && -n "${CURRENT_TAG_SHA}" ]]; then
            previous_tag="$(
              git tag --list 'v*' --sort=-v:refname \
                | grep -Fxv "${RELEASE_TAG}" \
                | head -n 1 \
                || true
            )"
          else
            previous_tag="$(git tag --list 'v*' --sort=-v:refname | head -n 1 || true)"
          fi

          arguments=(
            --method POST
            "repos/${GITHUB_REPOSITORY}/releases/generate-notes"
            -f "tag_name=${RELEASE_TAG}"
            -f "target_commitish=${{ needs.plan.outputs.source_sha }}"
          )
          if [[ -n "${previous_tag}" ]]; then
            arguments+=(-f "previous_tag_name=${previous_tag}")
          fi
          gh api "${arguments[@]}" --jq .body > .release/release-notes.md
          test -s .release/release-notes.md
      - name: Synchronize the target version transactionally
        if: needs.plan.outputs.needs_bump == 'true'
        env:
          RELEASE_VERSION: ${{ needs.plan.outputs.version }}
        run: |
          node scripts/release/sync-version.mjs \
            "${RELEASE_VERSION}" \
            --notes-file .release/release-notes.md \
            --date "$(date -u +%F)"

          node scripts/release/sync-version.mjs --list-files | sort -u > /tmp/allowed-version-files
          git diff --name-only | sort -u > /tmp/changed-version-files
          unexpected="$(comm -23 /tmp/changed-version-files /tmp/allowed-version-files)"
          if [[ -n "${unexpected}" ]]; then
            echo "Version synchronization changed files outside its contract:" >&2
            echo "${unexpected}" >&2
            exit 1
          fi
          test -s /tmp/changed-version-files
      - run: npm ci
      - run: npm run validate
      - uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2
        with:
          php-version: '8.3'
          extensions: zip
          coverage: none
      - run: php companion/tests/run.php
      - name: Build the companion reproducibly
        run: |
          first="$(php companion/build.php)"
          first_digest="$(sha256sum "${first}" | cut -d' ' -f1)"
          first_plugin_digest="$(sha256sum companion/dist/plg_console_joomlamcp.zip | cut -d' ' -f1)"
          second="$(php companion/build.php)"
          second_digest="$(sha256sum "${second}" | cut -d' ' -f1)"
          second_plugin_digest="$(sha256sum companion/dist/plg_console_joomlamcp.zip | cut -d' ' -f1)"
          test "${first}" = "${second}"
          test "${first_digest}" = "${second_digest}"
          test "${first_plugin_digest}" = "${second_plugin_digest}"
      - name: Verify the complete release identity
        env:
          RELEASE_VERSION: ${{ needs.plan.outputs.version }}
        run: node scripts/release/verify-version.mjs
      - name: Validate release-app configuration
        env:
          RELEASE_APP_ID: ${{ secrets.RELEASE_APP_ID }}
          RELEASE_APP_PRIVATE_KEY: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
        run: |
          if [[ -n "${RELEASE_APP_ID}" && -z "${RELEASE_APP_PRIVATE_KEY}" ]] \
            || [[ -z "${RELEASE_APP_ID}" && -n "${RELEASE_APP_PRIVATE_KEY}" ]]; then
            echo 'RELEASE_APP_ID and RELEASE_APP_PRIVATE_KEY must be configured together.' >&2
            exit 1
          fi
      - id: release-app
        name: Create protected release-app token when configured
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        env:
          RELEASE_APP_ID: ${{ secrets.RELEASE_APP_ID }}
          RELEASE_APP_PRIVATE_KEY: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
        if: env.RELEASE_APP_ID != '' && env.RELEASE_APP_PRIVATE_KEY != ''
        with:
          app-id: ${{ env.RELEASE_APP_ID }}
          private-key: ${{ env.RELEASE_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: joomla-mcp
      - id: publish
        name: Commit and atomically anchor the release
        env:
          BASE_SHA: ${{ needs.plan.outputs.base_sha }}
          NEEDS_BUMP: ${{ needs.plan.outputs.needs_bump }}
          RELEASE_TOKEN: ${{ steps.release-app.outputs.token || github.token }}
          RELEASE_TAG: ${{ needs.plan.outputs.tag }}
        run: |
          git config user.name 'joomengine-release[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'

          if [[ "${NEEDS_BUMP}" == 'true' ]]; then
            mapfile -t changed < /tmp/changed-version-files
            git add -- "${changed[@]}"
            git commit -m "chore(release): ${RELEASE_TAG}"
          fi
          release_commit="$(git rev-parse HEAD)"

          existing_tag_sha="$(git rev-list -n 1 "${RELEASE_TAG}" 2>/dev/null || true)"
          if [[ -n "${existing_tag_sha}" ]]; then
            if [[ "${existing_tag_sha}" != "${release_commit}" ]]; then
              echo "Tag ${RELEASE_TAG} points to ${existing_tag_sha}, not ${release_commit}." >&2
              exit 1
            fi
            if [[ "${NEEDS_BUMP}" == 'true' ]]; then
              echo "Tag ${RELEASE_TAG} already exists while a new version commit is required." >&2
              exit 1
            fi
          else
            git tag -a "${RELEASE_TAG}" "${release_commit}" \
              -m "JoomEngine MCP for Joomla ${RELEASE_TAG}"
            remote_main="$(
              authorization="$(printf 'x-access-token:%s' "${RELEASE_TOKEN}" | base64 -w0)"
              git -c "http.https://github.com/.extraheader=AUTHORIZATION: basic ${authorization}" \
                ls-remote origin refs/heads/main \
                | cut -f1
            )"
            if [[ "${remote_main}" != "${BASE_SHA}" ]]; then
              echo "main advanced from ${BASE_SHA} to ${remote_main}; release was not pushed." >&2
              exit 1
            fi
            authorization="$(printf 'x-access-token:%s' "${RELEASE_TOKEN}" | base64 -w0)"
            if [[ "${NEEDS_BUMP}" == 'true' ]]; then
              git -c "http.https://github.com/.extraheader=AUTHORIZATION: basic ${authorization}" \
                push --atomic origin \
                "${release_commit}:refs/heads/main" \
                "refs/tags/${RELEASE_TAG}"
            else
              git -c "http.https://github.com/.extraheader=AUTHORIZATION: basic ${authorization}" \
                push origin "refs/tags/${RELEASE_TAG}"
            fi
          fi

          echo "release_commit=${release_commit}" >> "${GITHUB_OUTPUT}"
          {
            echo '## Immutable source anchor'
            echo
            echo "- Commit: \`${release_commit}\`"
            echo "- Tag: \`${RELEASE_TAG}\`"
          } >> "${GITHUB_STEP_SUMMARY}"
      - name: Dispatch current publication logic for the immutable release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_COMMIT: ${{ steps.publish.outputs.release_commit }}
          RELEASE_TAG: ${{ needs.plan.outputs.tag }}
          RELEASE_VERSION: ${{ needs.plan.outputs.version }}
        run: |
          gh workflow run publish-release.yml \
            --repo "${GITHUB_REPOSITORY}" \
            --ref main \
            -f "release_version=${RELEASE_VERSION}" \
            -f "release_commit=${RELEASE_COMMIT}" \
            -f "source_run_id=${GITHUB_RUN_ID}"

          {
            echo '## Publication dispatched'
            echo
            echo "- Main-ref workflow: https://github.com/${GITHUB_REPOSITORY}/actions/workflows/publish-release.yml"
            echo "- Immutable source: \`${{ steps.publish.outputs.release_commit }}\`"
            echo "- Tag: \`${RELEASE_TAG}\`"
          } >> "${GITHUB_STEP_SUMMARY}"
