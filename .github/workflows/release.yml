name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: SemVer without the v prefix; must match package and companion manifests
        required: true
        type: string
      prerelease:
        description: Mark the GitHub release as a prerelease
        required: true
        default: false
        type: boolean

concurrency:
  group: release-${{ github.event_name == 'workflow_dispatch' && inputs.version || github.ref_name }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.version.outputs.tag }}
      prerelease: ${{ steps.version.outputs.prerelease }}
      npm_tag: ${{ steps.version.outputs.npm_tag }}
      already_released: ${{ steps.existing.outputs.already_released }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22.17.1'
          cache: npm
      - id: version
        name: Validate release version and source ref
        env:
          RELEASE_EVENT: ${{ github.event_name }}
          RELEASE_INPUT_VERSION: ${{ inputs.version }}
          RELEASE_INPUT_PRERELEASE: ${{ inputs.prerelease }}
          RELEASE_REF: ${{ github.ref }}
          RELEASE_REF_NAME: ${{ github.ref_name }}
        run: node scripts/release/verify-version.mjs
      - id: existing
        name: Validate existing tag and release state
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.version.outputs.tag }}
        run: |
          existing_sha="$(
            gh api \
              -H 'Accept: application/vnd.github+json' \
              "repos/${GITHUB_REPOSITORY}/commits/${RELEASE_TAG}" \
              --jq .sha 2>/dev/null || true
          )"
          if [[ -n "${existing_sha}" && "${existing_sha}" != "${GITHUB_SHA}" ]]; then
            echo "Tag ${RELEASE_TAG} already points to ${existing_sha}, not ${GITHUB_SHA}." >&2
            exit 1
          fi
          if gh release view "${RELEASE_TAG}" --repo "${GITHUB_REPOSITORY}" >/dev/null 2>&1; then
            if [[ "${GITHUB_EVENT_NAME}" == "workflow_dispatch" ]]; then
              echo "Release ${RELEASE_TAG} already exists." >&2
              exit 1
            fi
            echo 'already_released=true' >> "${GITHUB_OUTPUT}"
          else
            echo 'already_released=false' >> "${GITHUB_OUTPUT}"
          fi

  server:
    needs: prepare
    if: needs.prepare.outputs.already_released != 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22.17.1'
          cache: npm
      - run: npm ci
      - run: npm run validate
      - name: Build server and deployment packages
        env:
          RELEASE_TAG: ${{ needs.prepare.outputs.tag }}
        run: |
          mkdir -p release-assets
          npm pack --ignore-scripts --pack-destination release-assets
          mv release-assets/*.tgz "release-assets/joomengine-mcp-for-joomla-${RELEASE_TAG}.tgz"
          tar -czf "release-assets/joomengine-mcp-for-joomla-deployment-${RELEASE_TAG}.tar.gz" \
            README.md LICENSE SECURITY.md Dockerfile \
            config/sites.example.json config/sites.single-site-readonly.example.json \
            deploy scripts/deploy \
            docs/CLIENTS.md docs/DEPLOYMENT.md docs/LIBRARY.md docs/OPERATIONS.md \
            docs/RELEASING.md docs/SINGLE_SITE.md docs/TROUBLESHOOTING.md
      - uses: actions/attest-build-provenance@v4
        with:
          subject-path: release-assets/*
      - uses: actions/upload-artifact@v7
        with:
          name: server-${{ needs.prepare.outputs.tag }}
          path: release-assets/*
          if-no-files-found: error

  registry:
    needs: [prepare, server]
    if: needs.prepare.outputs.already_released != 'true'
    runs-on: ubuntu-latest
    environment: npm
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/setup-node@v7
        with:
          node-version: '22.17.1'
          registry-url: https://registry.npmjs.org
      - name: Install trusted-publishing-compatible npm
        run: npm install --global npm@11.18.0
      - uses: actions/download-artifact@v8
        with:
          name: server-${{ needs.prepare.outputs.tag }}
          path: release-assets
      - name: Publish the exact tested npm package
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          NPM_TAG: ${{ needs.prepare.outputs.npm_tag }}
          RELEASE_VERSION: ${{ needs.prepare.outputs.version }}
          RELEASE_TAG: ${{ needs.prepare.outputs.tag }}
        run: |
          asset="release-assets/joomengine-mcp-for-joomla-${RELEASE_TAG}.tgz"
          test -f "${asset}"
          local_integrity="sha512-$(openssl dgst -sha512 -binary "${asset}" | base64 -w0)"
          registry_integrity="$(
            npm view "@joomengine/joomla-mcp@${RELEASE_VERSION}" dist.integrity \
              --registry=https://registry.npmjs.org 2>/dev/null || true
          )"
          if [[ -n "${registry_integrity}" ]]; then
            if [[ "${registry_integrity}" != "${local_integrity}" ]]; then
              echo "npm already contains @joomengine/joomla-mcp@${RELEASE_VERSION} with different integrity." >&2
              exit 1
            fi
            echo "@joomengine/joomla-mcp@${RELEASE_VERSION} is already published with matching integrity."
            exit 0
          fi
          npm publish "${asset}" \
            --access public \
            --tag "${NPM_TAG}" \
            --provenance \
            --registry=https://registry.npmjs.org

  image:
    needs: prepare
    if: needs.prepare.outputs.already_released != 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@v7
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/setup-buildx-action@v4
      - id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/joomla-mcp:${{ needs.prepare.outputs.tag }}
          labels: |
            org.opencontainers.image.version=${{ needs.prepare.outputs.version }}
            org.opencontainers.image.revision=${{ github.sha }}
      - uses: actions/attest-build-provenance@v4
        with:
          subject-name: ghcr.io/${{ github.repository_owner }}/joomla-mcp
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true

  sbom:
    needs: prepare
    if: needs.prepare.outputs.already_released != 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - name: Generate source SBOM
        uses: anchore/sbom-action@v0
        with:
          path: .
          format: spdx-json
          output-file: joomengine-mcp-for-joomla-${{ needs.prepare.outputs.tag }}.spdx.json
          upload-artifact: false
      - uses: actions/upload-artifact@v7
        with:
          name: sbom-${{ needs.prepare.outputs.tag }}
          path: joomengine-mcp-for-joomla-${{ needs.prepare.outputs.tag }}.spdx.json
          if-no-files-found: error

  companion:
    needs: prepare
    if: needs.prepare.outputs.already_released != 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@v7
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: zip
          coverage: none
      - run: php companion/tests/run.php
      - run: php companion/build.php
      - name: Verify companion package name
        env:
          RELEASE_VERSION: ${{ needs.prepare.outputs.version }}
        run: test -f "companion/dist/pkg_joomlamcp-${RELEASE_VERSION}.zip"
      - uses: actions/attest-build-provenance@v4
        with:
          subject-path: companion/dist/pkg_joomlamcp-*.zip
      - uses: actions/upload-artifact@v7
        with:
          name: companion-${{ needs.prepare.outputs.tag }}
          path: companion/dist/pkg_joomlamcp-*.zip
          if-no-files-found: error

  release:
    needs: [prepare, server, registry, image, sbom, companion]
    if: needs.prepare.outputs.already_released != 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@v8
        with:
          pattern: '*-${{ needs.prepare.outputs.tag }}'
          path: release-assets
          merge-multiple: true
      - name: Create manual release tag
        if: github.event_name == 'workflow_dispatch'
        env:
          RELEASE_TAG: ${{ needs.prepare.outputs.tag }}
        run: |
          if git rev-parse --verify --quiet "refs/tags/${RELEASE_TAG}"; then
            test "$(git rev-list -n 1 "${RELEASE_TAG}")" = "${GITHUB_SHA}"
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git tag -a "${RELEASE_TAG}" "${GITHUB_SHA}" -m "JoomEngine MCP for Joomla ${RELEASE_TAG}"
            git push origin "refs/tags/${RELEASE_TAG}"
          fi
      - name: Generate release checksums
        working-directory: release-assets
        run: |
          test "$(find . -maxdepth 1 -type f | wc -l)" -ge 4
          find . -maxdepth 1 -type f ! -name SHA256SUMS -printf '%f\n' \
            | sort \
            | xargs sha256sum > SHA256SUMS
      - name: Publish immutable GitHub release assets
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.prepare.outputs.tag }}
          PRERELEASE: ${{ needs.prepare.outputs.prerelease }}
        run: |
          mapfile -t assets < <(find release-assets -maxdepth 1 -type f -print | sort)
          test "${#assets[@]}" -ge 5
          flags=()
          if [[ "${PRERELEASE}" == "true" ]]; then
            flags+=(--prerelease)
          fi
          gh release create "${RELEASE_TAG}" "${assets[@]}" \
            --verify-tag \
            --title "JoomEngine MCP for Joomla ${RELEASE_TAG}" \
            --generate-notes \
            "${flags[@]}"
